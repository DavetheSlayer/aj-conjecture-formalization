name = "aj_conjecture"
version = "1.0.0"
defaultTargets = ["Proofs", "Solution"]

# Mathlib is pinned to the exact commit the development was checked against
# (lake-manifest.json pins the transitive dependencies as well).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "26573066084e6e2aa8526ea358bc43b66d96f970"

# All proofs, in the folder `Proofs/` (module names do not contain the folder: the file
# `Proofs/AJFamily/Skein/TorusWord.lean` is the module `AJFamily.Skein.TorusWord`).
#   AJConjecture   the definitions (the seven definition files of the statement), the
#                  skein-theoretic and q-algebraic machinery, the unknot sanity check; its root
#                  module states `AJConjecture.not_ajSquareFreeConjecture` and derives it from the
#                  case k = 1 of the family.
#   AJFamily       the infinite family; its root module states and proves
#                  `AJConjecture.ajFamily_main` (infinitely many counterexamples, the Mahler
#                  measure of the extra factor, the volume of the Whitehead link complement, the
#                  Whitehead slice).
#   AJHandoff      the contracts of the 15 November handoff and the 16 November follow-up:
#                  Theorem T for the Whitehead doubles of all torus knots T(r, s), the local
#                  Theorem I and the sequence theorem S, the exact minimal recurrence of the
#                  family, Theorem G, the satellite bridge. Index: Proofs/AJHandoff.lean.
#   AJTwist        the four families of the 18 November handoff: the twisted Whitehead doubles
#                  W_{±,l}(T(r, ±s)), every integer twist l, both clasp signs, both companion
#                  chiralities; its root module names `AJConjecture.theoremFourFamilies`
#                  (Proofs/AJTwist/Main/TwMTheorem.lean). Packages: Knot, Quantum, Exist, Factor,
#                  Select, Classical, Main.
#   AJPaper        the further claims of the paper that need no topology: Sections 7.6, 8.4,
#                  8.5 and 9, and Zheng's estimates for Theorem B.1 (4). Packages: Sharp,
#                  Divisor, Ideal, Finger, Filling, Zheng; index in Proofs/AJPaper.lean.
#   SolutionDefs   replacement definitions used by the statements of `Solution.lean` (they differ
#                  from the library's definitions only in proof terms).
# The globs make `lake build` check every file of the folder, including those that the root
# modules do not import (e.g. the 7 files of the unknot sanity check).
[[lean_lib]]
name = "Proofs"
srcDir = "Proofs"
roots = ["AJConjecture", "AJFamily", "AJHandoff", "AJTwist", "AJPaper", "SolutionDefs"]
globs = ["AJConjecture.*", "AJFamily.*", "AJHandoff.*", "AJTwist.*", "AJPaper.*", "SolutionDefs"]

# The solution: one file, `Solution.lean`. It states the release theorems (data-only statements)
# and proves them from the modules of `Proofs/`.
[[lean_lib]]
name = "Solution"

# The challenge for `lake comparator` (see comparator.json, ../docs/V1_SCOPE.md and
# ../docs/FOUR_FAMILIES.md): `Challenge.lean`
# holds the same statements with `sorry` in place of their proofs, on top of one module per
# source file (`Challenge/C_*.lean`) with verbatim copies of the declarations the statements use;
# the challenge imports only Mathlib. Generated by tools/make_challenge.py. Not a default target.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge.*"]
